databases:
  - name: mboa-market-db
    databaseName: mboa_market
    user: mboa_user
    region: frankfurt
    plan: free

services:
  - type: web
    name: mboa-market-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python setup_render.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mboa-market-db
          property: connectionString
      - key: SECRET_KEY
        value: mboa-market-secret-key-2024-production-v2
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://mboa-market.netlify.app,http://localhost:5173"
