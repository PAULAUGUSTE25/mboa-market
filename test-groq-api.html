<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Groq API - MBOA Market</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a0f0d;
            color: #fff;
        }
        .container {
            background: #1a1f1d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #10b981;
            text-align: center;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #10b981;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #10b981;
            border-radius: 5px;
            background: #0a0f0d;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #10b981;
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #059669;
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #064e3b;
            border: 1px solid #10b981;
        }
        .error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
        }
        .info {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
        }
        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .status.online {
            background: #064e3b;
            color: #10b981;
        }
        .status.offline {
            background: #7f1d1d;
            color: #ef4444;
        }
        code {
            background: #0a0f0d;
            padding: 2px 6px;
            border-radius: 3px;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Groq API - MBOA Market</h1>
        
        <div class="input-group">
            <label>🔑 Clé API Groq :</label>
            <input type="text" id="apiKey" value="gsk_8xQZJ3WqYKLmN4pRvT5sWGdyb3FYcH9jKlMnOpQrStUvWxYz" placeholder="Entrez votre clé API Groq">
            <small style="color: #6b7280;">Obtenez votre clé gratuite sur : <a href="https://console.groq.com/keys" target="_blank" style="color: #10b981;">console.groq.com/keys</a></small>
        </div>

        <div class="input-group">
            <label>💬 Message de test :</label>
            <textarea id="message" rows="3" placeholder="Tapez votre message...">Bonjour, comment cultiver le maïs au Cameroun ?</textarea>
        </div>

        <button onclick="testGroqAPI()" id="testBtn">🚀 Tester l'API Groq</button>

        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        async function testGroqAPI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const message = document.getElementById('message').value.trim();
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const testBtn = document.getElementById('testBtn');

            if (!apiKey) {
                resultDiv.innerHTML = '<div class="result error">❌ Veuillez entrer une clé API</div>';
                return;
            }

            if (!message) {
                resultDiv.innerHTML = '<div class="result error">❌ Veuillez entrer un message</div>';
                return;
            }

            // Désactiver le bouton
            testBtn.disabled = true;
            testBtn.textContent = '⏳ Test en cours...';
            statusDiv.innerHTML = '<div class="status info">🔄 Connexion à Groq API...</div>';
            resultDiv.innerHTML = '';

            try {
                const startTime = Date.now();
                
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            {
                                role: 'system',
                                content: 'Tu es Léa, assistante agricole au Cameroun. Réponds en français de manière naturelle.'
                            },
                            {
                                role: 'user',
                                content: message
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const endTime = Date.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: { message: 'Erreur inconnue' } }));
                    throw new Error(`${response.status}: ${errorData.error?.message || 'Erreur API'}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0]?.message?.content;

                if (aiResponse) {
                    statusDiv.innerHTML = '<div class="status online">✅ API GROQ FONCTIONNE EN LIGNE !</div>';
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ SUCCÈS !</strong><br><br>
                            <strong>⏱️ Temps de réponse :</strong> ${duration}s<br>
                            <strong>🤖 Modèle :</strong> ${data.model}<br>
                            <strong>📊 Tokens utilisés :</strong> ${data.usage?.total_tokens || 'N/A'}<br><br>
                            <strong>💬 Réponse de l'IA :</strong><br>
                            ${aiResponse}
                        </div>
                    `;
                } else {
                    throw new Error('Pas de réponse de l\'IA');
                }

            } catch (error) {
                statusDiv.innerHTML = '<div class="status offline">❌ API GROQ NE FONCTIONNE PAS</div>';
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ ERREUR :</strong><br><br>
                        ${error.message}<br><br>
                        <strong>Solutions possibles :</strong><br>
                        1. Vérifiez que votre clé API est valide<br>
                        2. Obtenez une nouvelle clé sur <a href="https://console.groq.com/keys" target="_blank" style="color: #10b981;">console.groq.com/keys</a><br>
                        3. Vérifiez votre connexion internet<br>
                        4. La clé commence bien par <code>gsk_</code>
                    </div>
                `;
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🚀 Tester l\'API Groq';
            }
        }

        // Test automatique au chargement
        window.addEventListener('load', () => {
            console.log('🧪 Page de test Groq API chargée');
            console.log('📝 Cliquez sur le bouton pour tester votre clé API');
        });
    </script>
</body>
</html>
